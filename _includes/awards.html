{% if site.data.profile.awards %}
  <p class="title">{{ site.theme_settings.awards_title }}</p>
  <ul class="awards-list">
    {% for award in site.data.profile.awards %}
    {% assign award_title = award.title | default: award %}
    <li class="award">
      {{ award_title }}
      {% if award.image %}
      <img src="{{ award.image | relative_url }}" alt="{{ award_title }}">
      {% endif %}
    </li>
    {% endfor %}
  </ul>
{% endif %}
