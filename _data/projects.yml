- project:
    category: Course Projects
    print: True
    modal: True
    date: November 2025
    title: Door Opening Robot — Introduction to Robotics
    summary: 4-DOF serial manipulator for rotating a handle and opening a sliding door
    skills: ["MATLAB"]
    description: For the Introduction to Robotics course, I modeled and simulated a planar four-degree-of-freedom door-opening manipulator in MATLAB. The mechanism combines a 3R serial arm with a revolute joint for handle rotation. I implemented quintic trajectories and inverse kinematics, analyzed the workspace and singularities, and calculated Jacobians and inverse-dynamics torques for the simulated door-opening task.
