- project:
    category: Academic & Professional
    print: True
    modal: True
    date: September 2026 – Present
    title: HARBOR_DOCK — SRIIAS, Tongji University
    summary: Foundation-model-based long-horizon one-shot planning for autonomous mobile manipulation.
    skills: ["Python (PyTorch)"]
    description: At SRIIAS, Tongji University, I am developing HARBOR-DOCK, a harness-engineering framework for foundation-model-based mobile manipulation. The framework combines an evolving skill library with perception-based feedback to plan and execute long-horizon tasks in a single attempt on a dual-arm mobile manipulator.
    media:
      type: video
      path: HARBOR_DOCK.mp4
      mime_type: video/mp4
      alt: HARBOR-DOCK harness-engineering framework demonstration of the task description "Pick up the dumbling and drop it in the basket"

- project:
    category: Academic & Professional
    print: True
    modal: True
    date: September 2025 – July 2026
    title: LIE IS — DRCD, KAIST
    summary: Tightly coupled invariant smoothing for state estimation in legged robots.
    skills: ["C++", "MATLAB"]
    description: At the Dynamic Robot Control & Design Laboratory (DRCD), KAIST, I developed a tightly coupled invariant smoother for quadruped state estimation. The fixed-lag estimator jointly incorporates LiDAR scan-to-map geometry with inertial and leg-kinematic measurements to estimate the robot's motion.
    media:
      type: video
      path: InvariantSmoother.mp4
      mime_type: video/mp4
      alt: LIE-IS invariant smoothing framework demonstration
    contents:
      - title: Research focus
        description: Jointly incorporates LiDAR scan-to-map geometry with inertial and kinematic factors in a fixed-lag estimator.

