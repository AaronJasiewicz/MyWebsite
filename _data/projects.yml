- project:
    category: Academic & Professional
    print: True
    modal: True
    date: September 2026 – Present
    title: HARBOR_DOCK — SRIIAS, Tongji University
    summary: Foundation-model-based long-horizon one-shot planning for autonomous mobile manipulation.
    skills: ["Python (PyTorch)"]
    description: >-
      At the Shanghai Research Institute for Intelligent Autonomous Systems (SRIIAS), Tongji University, I am developing HARBOR-DOCK, a harness-engineering framework for long-horizon mobile manipulation. Given a single pair of wrist-camera images, the robot's initial state and calibration, and a concise task instruction, the system can perform previously unseen tasks without task-specific pretraining. It leverages foundation models and an evolving skill library, guided by physical and geometric constraints, to plan and execute tasks on a dual-arm mobile manipulator.
    media:
      type: video
      path: HARBOR_DOCK.mp4
      mime_type: video/mp4
      alt: HARBOR-DOCK mobile-manipulation demonstration
      caption: 'Task instruction: "Grab the dumpling and drop it into the basket"'

- project:
    category: Academic & Professional
    print: True
    modal: True
    date: September 2025 – July 2026
    title: LIE IS — DRCD, KAIST
    summary: Invariant LiDAR-proprioceptive smoothing for quadruped state estimation.
    skills: ["C++", "MATLAB"]
    description: >-
      At the Dynamic Robot Control & Design Laboratory (DRCD), KAIST, I extended a proprioceptive baseline for quadruped state estimation with a LiDAR scan-to-map factor expressed in right-invariant error coordinates, preserving the smoother's invariant error dynamics. To investigate convergence behavior in isolation, I also developed a non-invariant counterpart. Evaluations on native and public datasets showed that both formulations achieved accuracy competitive with an established estimator.
    media:
      type: video
      path: InvariantSmoother.mp4
      mime_type: video/mp4
      alt: LIE-IS invariant smoothing framework demonstration
    contents:
      - title: Research focus
        description: The fixed-lag estimator combines LiDAR scan-to-map constraints with inertial and leg-kinematic measurements. The invariant and non-invariant formulations support a controlled comparison of convergence behavior.

