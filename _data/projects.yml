- project:
    category: Academic & Professional
    print: True
    modal: True
    date: September 2023 – March 2024
    title: MIDAS Tool & Customer Error Project — Mercedes-AMG
    summary: Development vehicle support and control-unit signal analysis.
    skills: ["Python", "CAN Bus"]
    description: >-
      During my R&D internship at Mercedes-AMG, I developed the MIDAS Python tool to process MDF4 measurement files, identify diagnostic trouble codes (DTCs), error events, and malfunction-indicator-lamp (MIL) activations, and search for predefined signal conditions. I was also de facto responsible for investigating a field-customer error. I traced its cause to control-unit signals, reproduced the issue from measurement data, and coordinated with software providers to deliver a software fix. I designed the validation campaign, took part in three test-site trips, analyzed data throughout the campaign, and instructed the endurance-testing team. We successfully validated the resolution of the reported error, and the software fix was ultimately delivered to the customer.
    media:
      type: image
      path: AMG.png
      alt: Mercedes-AMG building and performance signage

- project:
    category: Academic & Professional
    print: True
    modal: True
    date: August 2023
    title: Bachelor's Thesis Student - IFKM, KIT
    summary: Cylinder-pressured-indication-based knock detection and staged combustion control for a hydrogen engine.
    skills: ["Simulink", "MATLAB", "dSPACE"]
    description: At KIT's Institute for Reciprocating Engines (IFKM), I developed a cylinder-pressure-indication-based knock-detection and mitigation controller for a hydrogen internal-combustion engine. Implemented in MATLAB/Simulink and deployed on dSPACE for rapid prototyping, the controller first retards ignition timing when pressure-derived indicators detect knock. If combustion quality does not improve, a second control stage reduces the fuel mass.
    media:
      type: image
      path: BA_Setup.jpeg
      alt: Hardware-in-the-loop setup for the hydrogen engine thesis
    contents:
      - title: Thesis system model
        media:
          type: image
          path: BA_System.jpeg
          alt: Control-system model for combustion anomaly detection
        description: I implemented the engine-indication measurement chain and online thermodynamic and combustion calculations used to derive pressure-based knock indicators. I integrated the two-stage ignition-retard and fuel-mass control in MATLAB/Simulink and deployed it to dSPACE for rapid-prototyping tests.

